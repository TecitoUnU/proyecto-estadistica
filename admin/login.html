<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#001B47" />
    <link rel="icon" href="data:," />
    <title>Acceso administrativo</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body class="page page-admin">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="../index.html">Estadística I</a>
        <p class="brand-sub">Acceso administrativo</p>
      </div>
    </header>

    <main class="login-wrap">
      <section class="card login-card" aria-labelledby="login-titulo">
        <h1 id="login-titulo">Iniciar sesión</h1>
        <p>Solo usuarios con rol de administrador pueden continuar.</p>

        <div id="alerta-login" class="alert" hidden></div>

        <form id="form-login" novalidate>
          <div class="field">
            <label for="correo">Correo electrónico</label>
            <input
              id="correo"
              name="correo"
              type="email"
              autocomplete="email"
              required
              aria-describedby="correo-error"
            />
            <p class="field-error" id="correo-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              aria-describedby="password-error"
            />
            <p class="field-error" id="password-error" role="alert"></p>
          </div>

          <button type="submit" class="btn btn-primary" id="btn-login">Entrar</button>
        </form>

        <p class="login-back"><a href="../index.html">← Volver al sitio</a></p>
      </section>
    </main>

    <script type="module" src="../js/login.js"></script>
  </body>
</html>
